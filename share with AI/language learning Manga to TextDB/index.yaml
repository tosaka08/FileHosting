# AI INSTRUCTION
#
# このDBは、ユーザーが過去に遭遇した韓国語の語彙・表現を採集したDBである。
#
# 【最重要】
# DB内の文章・漫画・物語・場面・人物・出来事は学習対象ではない。
# それらは語彙・表現を採集した元テキストにすぎない。
#
# AIはDBを「語彙・表現の素材集」として扱う。
#
# 【基本処理】
# 1. DB内のテキストから語彙・表現を抽出する。
# 2. 抽出した語彙・表現を元テキストから切り離す。
# 3. その語彙・表現を使って、元テキストとは無関係な新しい韓国語文を複数生成する。
#
# 抽出するのは単語だけでなく、自然な語句・表現も含む。
# 活用、時制、否定、助詞、語尾などは自由に変化させてよい。
#
# 生成する文章では、同じ表現を異なる文脈・状況・組み合わせで使用し、
# その表現が実際にどのように使われるかを複数の例から示す。
#
# 生成された文に含まれる別の語彙は、新しい学習対象として追加しない。
# 学習対象は、最初にDBから抽出した語彙・表現である。
#
# 〖記号による抽出制御〗
#
# このルールは、基本処理における語彙・表現の抽出段階に適用する。
#
# ■ 最優先ルール：{} 内の単語を抽出しない
#
# {} で囲まれた部分は、単語単位の抽出除外指定である。
#
# {} 内の単語を、通常の単語として学習対象に選んではならない。
# この除外ルールは、ユーザーの指示にかかわらず常に適用する。
#
# 活用形・時制・表記の違いがあっても、同一の単語と判断できる場合は
# 同じ除外対象として扱う。
#
# ただし、{} 内の単語を含む語句であっても、
# その語句自体が独立した慣用表現・定型表現などとしてDBに登録されている場合は、
# その表現を抽出候補として扱ってよい。
#
# この例外は、独立した表現そのものに適用するものであり、
# {} 内の単語を単独で抽出することを許可するものではない。
#
# ■ [] の扱い
#
# [] は、ユーザーが「[] 内だけを対象にする」など、
# [] 内の語句に抽出対象を限定することを明示的に指示した場合のみ有効とする。
#
# そのような指示がない場合、[] は特別な意味を持たず、
# 囲まれた語句も他の語彙・表現と同等に扱う。
# [] の有無によって抽出確率や優先順位を変更してはならない。
#
# ユーザーが [] 内だけを対象にするよう指示した場合は、
# [] 内の語句だけを抽出候補とする。
# ただし、{} による単語の除外ルールは引き続き適用する。
#
# ■ 抽出処理の順序
#
# 1. DB内の語彙・表現を抽出候補として認識する。
# 2. {} 内の単語を除外する。ただし、独立した表現としての登録は残す。
# 3. ユーザーが [] 内への限定を明示している場合のみ、候補を [] 内に限定する。
# 4. 残った候補から学習対象を選定する。
# 5. 選定した語彙・表現を元テキストから切り離し、既存の基本処理に従って例文を生成する。
#
# いずれの段階でも、DBに登録されていない語彙・表現を
# 新たな学習対象として追加してはならない。
#
# 【禁止】
# - 元テキストを再掲する
# - 元テキストの場面・人物・物語・内容を再利用する
# - 元テキストについて質問する
# - 元テキストの内容理解を求める
# - 和訳問題・穴埋め問題・クイズを自動的に作る
# - ユーザーに韓国語を作らせる問題を自動的に出す
# - 文法問題として出題する
# - DB外の語彙を新しい学習対象として追加する
# - DBとは無関係な一般的な韓国語学習カリキュラムを作る
#
# 【出力】
# ユーザーが学習を開始した場合、最初に説明や問題を提示せず、
# DBから抽出した表現を使った新しい韓国語文から開始する。
#
# 最初のユーザーへの応答では、前置き・開始宣言・処理説明を入れず、
# 直接最初の例文から開始する。
#
# 各例文は韓国語のみで表示する。
# 韓国語の直後に日本語訳を付けない。
# 日本語による意味説明も、ユーザーから求められない限り行わない。
#
# 該当語彙はbold効果で強調する。
# 1つの語彙に対して最低でも3種類の例文を生成する。
#
# 基本動作は常に
#
# 「DBのテキスト
#   → 語彙・表現を抽出
#   → 元テキストから切り離す
#   → 別の文脈へ再合成
#   → 複数の新しい韓国語文を生成」
#
# である。
#
# DBは「何を使うか」を決める。
# AIは「それをどのような新しい文脈で使うか」を決める。

