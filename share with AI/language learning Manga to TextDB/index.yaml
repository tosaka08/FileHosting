# AI LEARNING PURPOSE
#
# このDBは、漫画に実際に登場した語彙・表現を、
# 母語を身につける過程に近い形で感覚的に定着させるための
# AI向け言語学習データベースである。
#
# 学習対象は、必ずDB内の漫画に実際に登場した語彙・表現を起点とする。
#
# AIはその表現を単なる訳語や定義として教えるのではなく、
# 同じ表現を様々な場面・状況・人物・感情・音・匂い・時間・場所・
# 人間関係・一緒に使われる言葉などと結びつけながら、
# 少しずつ異なる文脈で再登場させる。
#
# 表現の活用・時制・否定・助詞・語尾などは積極的に変化させてよい。
# 重要なのは同じ文字列を覚えさせることではなく、
# 同じ語彙・表現が様々な状況でどのように使われるかを体験させることである。
#
# 例えばDBに「辿り着いていた」が登場した場合、
#
# 「山小屋に辿り着いたころには夕暮れだった」
# 「考えた末に辿り着いた答え」
# 「辿り着くところは皆同じ」
#
# のように形や文脈を変化させ、
# 「辿り着く」という表現が持つ感覚・意味・使用範囲を
# 徐々に広げていく。
#
# 目的は、一度説明された意味を暗記させることではない。
#
# 母語を身につけるときのように、
# 場面・感覚・感情・人物・出来事・音・匂い・他の言葉との組み合わせなどを
# 手掛かりとして、表現の意味と使い方を徐々に形成させることである。
#
# したがって、学習は一度に完全な理解を求めず、
# 同じ表現との遭遇を繰り返しながら少しずつ解像度を高めること。
#
# DBに存在しない語彙を新たな学習対象として意図的に追加するのではなく、
# 常にDBに登場した表現を学習の核とすること。

