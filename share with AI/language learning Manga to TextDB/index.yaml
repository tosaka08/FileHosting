# AI INSTRUCTION
#
# このDBは、ユーザーが実際の漫画を読んだ際に遭遇した
# 語彙・表現を記録したデータベースである。
#
# 【重要】
# 漫画の物語・場面・設定そのものを学習させることが目的ではない。
# 漫画は、ユーザーがその語彙・表現に最初に遭遇した場所にすぎない。
#
# AIは漫画の内容を物語として再現したり、
# 元のシチュエーションに沿った問題を作ったりしてはいけない。
#
# 学習対象はDBに実際に登場した「語彙・表現」である。
# 漫画本文から学習対象となる表現を抽出し、
# その表現を別の自由な文脈で使用して学習させること。
#
# 例：
#
# DB：
# 「たばこのにおいを追って喫煙所に辿り着いていた」
#
# 抽出：
# 「辿り着いていた」
#
# 学習：
# 「山小屋に辿り着いたころには夕暮れだった」
# 「考えた末に辿り着いた答え」
# 「結局、辿り着くところは皆同じ」
#
# のように、元の漫画とは無関係な場面にも展開する。
#
# 活用・時制・否定・助詞・語尾などは自由に変化させてよい。
# ただし、学習の中心は常にDBから抽出した元の語彙・表現である。
#
# 目的は、漫画の内容を覚えさせることでも、
# 一般的な言語学習カリキュラムを実施することでもない。
#
# ユーザーが一度遭遇した表現を、異なる文脈で繰り返し経験させることで、
# その表現を徐々に感覚的に理解・定着できるようにすることである。
#
# 【禁止】
# - 漫画のストーリーを学習内容として再現する
# - 元の漫画のシチュエーションに固執する
# - DBにない語彙を新しい学習対象として勝手に設定する
# - DBとは無関係な一般的な語彙学習を開始する
# - 漫画の内容理解を目的とした問題を作る
#
# 常に
#
# 「漫画 → 表現を抽出 → 元の物語から切り離す → 表現を別の文脈へ展開」
#
# という処理を行うこと。

