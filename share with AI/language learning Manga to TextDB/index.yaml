# ============================================================
# AI DATABASE INSTRUCTION / FOOTNOTE
# ============================================================
#
# このデータベースは、単なる漫画テキストの検索・参照用データベースではない。
#
# AIはこのデータベースを、
# 「ユーザーがすでに一度読んだ漫画」を学習素材として利用し、
# その漫画中に登場した語彙・文法・定型表現・言い回し等を
# 「表現単位」で再利用しながら、ユーザーへの定着を促すための
# AI向け言語学習データベースとして扱うこと。
#
# ------------------------------------------------------------
# [PRIMARY PURPOSE]
# ------------------------------------------------------------
#
# 目的は、既存の漫画本文を単純に検索したり翻訳したりすることではなく、
# ユーザーが一度読んだ既知の文脈を利用して、
# そこで出会った表現の理解・想起・運用能力を段階的に高めることである。
#
# AIは、ユーザーがすでに読んだ漫画の文脈を「既知の文脈」として活用し、
# 新しい例文を無関係な教材から生成するよりも、
# 可能な限りこのDBに存在する実際の漫画中の表現・状況・人物関係・感情・
# 会話の流れを学習素材として利用すること。
#
# ------------------------------------------------------------
# [EXPRESSION-BASED LEARNING]
# ------------------------------------------------------------
#
# 学習対象は単語だけに限定しない。
#
# AIは必要に応じて以下のような「表現単位」を抽出・再構成すること。
#
# - 単語
# - 複合語
# - 助詞を含むまとまり
# - 活用形
# - 文法表現
# - 慣用表現
# - 定型句
# - コロケーション
# - 文脈依存の言い回し
# - 複数語からなる自然な発話単位
# - 漫画特有の省略・口語表現
#
# 「単語の意味を知っている」ことと
# 「その表現を実際の文脈で認識・想起・使用できる」ことを区別すること。
#
# ------------------------------------------------------------
# [LEARNING PROCESS]
# ------------------------------------------------------------
#
# ユーザーの過去の会話履歴から観察された、
# 「人間が特定の語彙・表現に対する理解の解像度を徐々に高めていく過程」
# を学習設計の参考にすること。
#
# 特に、
#
#   初期理解
#       ↓
#   文脈による意味の推測
#       ↓
#   辞書的意味との照合
#       ↓
#   類似表現との比較
#       ↓
#   ニュアンス・使用条件の理解
#       ↓
#   実際の文中での再認識
#       ↓
#   自力での想起
#       ↓
#   別の状況での運用
#
# というように、単純な「意味を教える → 覚える」という方式ではなく、
# 表現に対する理解の解像度を段階的に高めることを重視する。
#
# ------------------------------------------------------------
# [CONTEXT PRESERVATION]
# ------------------------------------------------------------
#
# 漫画中の表現を扱う際は、可能な限り以下の情報を保持すること。
#
# - 誰が発話したか
# - 誰に対して発話したか
# - 直前・直後の発話
# - 場面
# - 人物関係
# - 感情
# - 漫画特有のテンポ
# - 効果音
# - 省略
# - 文末表現
# - 敬語・タメ口等のレジスター
#
# 表現を文脈から切り離して単なる辞書項目として扱わないこと。
#
# ------------------------------------------------------------
# [RETRIEVAL POLICY]
# ------------------------------------------------------------
#
# ユーザーが特定の語彙・表現について質問した場合、
# まずこのDBからユーザーが既に読んだ漫画中の関連する実例を検索し、
# その実例を優先的に学習素材として使用すること。
#
# ユーザーの質問に直接関係する表現が複数存在する場合は、
# 必要に応じて異なる場面・人物・文脈における使用例を比較すること。
#
# ただし、DBに存在しない情報を無理にDB由来であるかのように扱わないこと。
#
# ------------------------------------------------------------
# [LEARNING GOAL]
# ------------------------------------------------------------
#
# 最終目的は「この表現の意味を説明できること」だけではない。
#
# ユーザーが後に同じ表現を別の文脈で見たときに、
#
#   「見たことがある」
#       ↓
#   「意味が推測できる」
#       ↓
#   「ニュアンスが分かる」
#       ↓
#   「なぜこの表現が使われているか分かる」
#       ↓
#   「自分でも使える」
#
# という段階へ進めることを目的とする。
#
# したがって、必要に応じて単純な説明だけではなく、
