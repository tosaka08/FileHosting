# AI INSTRUCTION
#
# このDBは、ユーザーが過去に遭遇した韓国語の語彙・表現を採集したDBである。
#
# 【最重要】
# DB内の文章・漫画・物語・場面・人物・出来事は学習対象ではない。
# それらは語彙・表現を採集した元テキストにすぎない。
#
# AIはDBを「語彙・表現の素材集」として扱う。
#
# 【基本処理】
# 1. DB内のテキストから語彙・表現を抽出する。
# 2. 抽出した語彙・表現を元テキストから切り離す。
# 3. その語彙・表現を使って、元テキストとは無関係な新しい韓国語文を生成する。
#
# 抽出するのは単語だけでなく、自然な語句・表現も含む。
# 活用・時制・否定・助詞・語尾などの変化は積極的に使用する。
# 同じ表現の活用形や文法的な変化も、同一のターゲット表現として扱う。
#
# 【生成ルール】
# - 1つのターゲット語彙・表現につき、最低3つの例文を生成する。
# - 可能であれば、異なる文脈・状況・組み合わせで使用する。
# - 元テキストとは無関係の新しい文脈を使用する。
# - 同じターゲットでも、活用・時制・否定・助詞・語尾などを変化させてよい。
# - ターゲット表現は、各例文の中で必ず1か所だけ **太字** にする。
# - ターゲット以外の語彙・表現は太字にしない。
# - 生成文に含まれる別の語彙を新しいターゲットとして追加しない。
#
# 【出力形式】
# ターゲットごとに、例文を3文以上連続して出力する。
#
# 例：
#
# 오늘은 일찍 일어나서 운동을 **잔뜩** 했다.
# 주말이라 공원에 사람이 **잔뜩** 모였다.
# 냉장고에 과일이 **잔뜩** 남아 있다.
#
# 이 소리는 정말 **참을 수 없어**.
# 너무 피곤해서 더 이상 **참을 수 없었다**.
# 웃음이 나오는 걸 **참을 수가 없어서** 결국 웃고 말았다.
#
# 各ターゲットの間に説明・和訳・解説を挿入しない。
# 韓国語の例文のみを出力する。
#
# 【開始時の動作】
# ユーザーが学習を開始した場合、前置き・開始宣言・処理説明を入れず、
# 直接例文から開始する。
#
# 【禁止】
# - 元テキストを再掲する
# - 元テキストの場面・人物・物語・内容を再利用する
# - 元テキストについて質問する
# - 元テキストの内容理解を求める
# - 和訳問題・穴埋め問題・クイズを自動的に作る
# - ユーザーに韓国語を作らせる問題を自動的に出す
# - 文法問題として出題する
# - DB外の語彙を新しいターゲットとして追加する
# - DBとは無関係な一般的な韓国語学習カリキュラムを作る
# - ターゲットごとの例文数を3文未満にする
# - 日本語訳や日本語による説明を例文と一緒に表示する
#
# 【基本動作】
# 「DBのテキスト
#   → 語彙・表現を抽出
#   → 元テキストから切り離す
#   → 別の文脈へ再合成
#   → 1ターゲットにつき3文以上生成
#   → ターゲット表現のみ太字で表示」
#
# DBは「何を使うか」を決める。
# AIは「それをどのような新しい文脈で使うか」を決める。

